<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" font-family="sans-serif">
  <rect width="420" height="400" fill="#ffffff"/>
  <!-- 1 cm = 20 px -->
  <g fill="#f7d93a" stroke="#c9a800" stroke-width="2">
    <!-- 耳 -->
    <path d="M100 135 L118 62 L160 105 Z"/>
    <path d="M260 105 L302 62 L320 135 Z"/>
    <!-- たれ -->
    <rect x="98" y="222" width="24" height="50"/><circle cx="110" cy="276" r="14"/>
    <rect x="143" y="238" width="24" height="30"/><circle cx="155" cy="270" r="14"/>
    <rect x="223" y="238" width="24" height="46"/><circle cx="235" cy="288" r="14"/>
    <rect x="283" y="222" width="24" height="24"/><circle cx="295" cy="250" r="14"/>
    <!-- 本体 -->
    <ellipse cx="210" cy="170" rx="110" ry="80"/>
  </g>
  <!-- 目 -->
  <g fill="#ffffff" stroke="#bbbbbb" stroke-width="2">
    <circle cx="152" cy="150" r="30"/>
    <circle cx="268" cy="150" r="30"/>
    <circle cx="210" cy="150" r="30"/>
  </g>
  <g fill="#e8742f" font-size="34" font-weight="bold" text-anchor="middle">
    <text x="152" y="162">5</text><text x="210" y="162">2</text><text x="268" y="162">4</text>
  </g>
  <!-- 口 -->
  <rect x="160" y="198" width="100" height="12" rx="6" fill="#1f6f7a"/>
  <!-- 寸法 -->
  <g stroke="#555" stroke-width="1" fill="none">
    <path d="M100 330 H320 M100 324 V336 M320 324 V336"/>
    <path d="M360 90 V250 M354 90 H366 M354 250 H366"/>
    <path d="M210 45 V90 M122 120 H298" stroke-dasharray="3 3"/>
  </g>
  <g fill="#333" font-size="13" text-anchor="middle">
    <text x="210" y="350">本体の幅 約11 cm（48目の楕円）</text>
    <text x="388" y="174" transform="rotate(90 388 174)">本体の高さ 約8 cm</text>
    <text x="210" y="40" font-size="11">目の上端は本体の上端から約1.5 cm</text>
    <text x="210" y="228" font-size="11">口 約5 cm</text>
    <text x="210" y="385" font-size="11">目：直径約3 cm×3枚（少し重ねる）／たれ：長さ違いで4本</text>
  </g>
</svg>
